# Xberg configuration — CPU-first OCR with quality-based VLM fallback.
# Loaded by the xberg engine starting from /app.
# NOTE: the VLM OCR model is defined HERE (single source of truth).
# api_key/base_url are still overridable via XBERG_LLM_API_KEY / XBERG_LLM_BASE_URL env
# (xberg serve forwards those onto ocr.vlm_config).

[ocr]
backend = "tesseract"
language = ["eng", "ukr", "spa"]  # Tesseract codes: ukr=Ukrainian, spa=Spanish

[ocr.vlm_fallback]
mode = "on_low_quality"
quality_threshold = 0.5

[ocr.vlm_config]
model = "puma-qwen3.5-2b-instruct"
base_url = "http://lite-llm:4000/v1"
